name: Publish NuGet

on:
    release:
        types:
            - published

permissions:
    contents: read
    id-token: write

env:
    DOTNET_VERSION: "11.0.x"
    SOLUTION_PATH: FatturaFacile.slnx

jobs:
    publish:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup .NET 11 RC
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}
                  include-prerelease: true

            - name: Extract Version
              shell: pwsh
              run: |
                  $version = "${{ github.event.release.tag_name }}".TrimStart('v')
                  "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
                  Write-Host "Version: $version"

            - name: Restore
              shell: pwsh
              run: |
                  dotnet restore

            - name: Build
              shell: pwsh
              run: |
                  dotnet build `
                    ${{ env.SOLUTION_PATH }} `
                    -c Release `
                    --no-restore `
                    -p:Version=${{ env.VERSION }} `
                    -p:AssemblyVersion=${{ env.VERSION }} `
                    -p:FileVersion=${{ env.VERSION }}

            - name: Test
              shell: pwsh
              run: |
                  dotnet test `
                    ${{ env.SOLUTION_PATH }} `
                    -c Release `
                    --no-build

            - name: Pack
              shell: pwsh
              run: |
                  # packs every project with IsPackable != false (tests are excluded in their csproj)
                  dotnet pack `
                    ${{ env.SOLUTION_PATH }} `
                    -c Release `
                    --no-build `
                    -o artifacts `
                    -p:Version=${{ env.VERSION }} `
                    -p:PackageVersion=${{ env.VERSION }} `
                    -p:AssemblyVersion=${{ env.VERSION }} `
                    -p:FileVersion=${{ env.VERSION }}

            - name: Verify Package
              shell: pwsh
              run: |
                  $packages = Get-ChildItem artifacts\*.nupkg -ErrorAction SilentlyContinue
                  if (-not $packages) {
                    Write-Error "No .nupkg produced in artifacts"
                    exit 1
                  }
                  $packages | Format-Table Name, Length

            - name: NuGet Login (OIDC)
              id: login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Publish to NuGet
              shell: pwsh
              run: |
                  dotnet nuget push "artifacts\*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
