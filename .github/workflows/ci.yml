name: CI

on:
    push:
        branches:
            - main
            - dev
            - feature/**
            - hotfix/**

    pull_request:
        branches:
            - main
            - dev

jobs:
    build-test:
        runs-on: windows-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore

            # - name: Verify formatting
            #   run: dotnet format --verify-no-changes --verbosity diagnostic

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Execute Unit Tests
              run: |
                  dotnet test `
                    --configuration Release `
                    --no-build `
                    --collect:"XPlat Code Coverage" `
                    --results-directory TestResults `
                    --logger trx

            - name: Upload TRX Results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: trx-results
                  path: TestResults/**/*.trx

            - name: Upload Coverage
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-results
                  path: TestResults/**/coverage.cobertura.xml

    inspect-code:
        # Dependabot and fork-safe: the job only reads the repository
        runs-on: windows-latest
        # First rollout: findings are reported as annotations without blocking the PR.
        # Remove continue-on-error once the existing findings are triaged.
        continue-on-error: true

        permissions:
            contents: read
            checks: write
            pull-requests: write

        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET SDK
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: ReSharper InspectCode
              uses: muno92/resharper_inspectcode@85a18351e1a10fc526932099d29c2dc9ac87d422 # v1.17.9
              with:
                  solutionPath: ./FatturaFacile.slnx
                  minimumReportSeverity: warning
                  failOnIssue: 1
                  minimumSeverity: error
