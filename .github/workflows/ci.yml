name: CI

on:
  push:
    branches:
      - main
      - dev
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '11.0.x'

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore Dependencies
        run: dotnet restore FatturaFacile.slnx

      - name: Verify Code Formatting
        run: dotnet format FatturaFacile.slnx --verify-no-changes --verbosity normal

      - name: Build Solution
        run: dotnet build FatturaFacile.slnx --configuration Release --no-restore

      - name: Execute Unit Tests
        run: |
          dotnet test FatturaFacile.slnx `
            --configuration Release `
            --no-build `
            --collect:"XPlat Code Coverage" `
            --results-directory TestResults `
            --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-results
          path: TestResults/**/*.trx
          retention-days: 14

      - name: Upload Code Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14
