# Temporary: runs dotnet format on Windows (same as CI) and uploads the patch. Removed before the PR.
name: tmp dotnet format

on:
    push:
        branches:
            - style/dotnet-format-analyzers

permissions:
    contents: read

jobs:
    format:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  global-json-file: global.json
            - run: dotnet restore
            - name: build (compile check, analyzer warnings not as errors)
              run: dotnet build --configuration Release --no-restore -p:TreatWarningsAsErrors=false -p:CodeAnalysisTreatWarningsAsErrors=false -p:RunAnalyzers=false -p:EnforceCodeStyleInBuild=false *> build.log; $code=$LASTEXITCODE; Select-String -Path build.log -Pattern " error " | Select-Object -First 40; exit $code
              continue-on-error: true
            - name: tests
              run: dotnet test --configuration Release --no-build
              continue-on-error: true
            - name: remaining diagnostics
              run: dotnet format --verify-no-changes --no-restore *> remaining.log; exit 0
            - name: patch
              shell: bash
              run: git -c core.autocrlf=false diff --binary -- . ':!remaining.log' ':!build.log' > format.patch || true
            - uses: actions/upload-artifact@v4
              with:
                  name: format
                  path: |
                      format.patch
                      remaining.log
                      build.log
