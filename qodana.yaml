version: "1.0"

linter: QDNET

profile:
  name: qodana.recommended

include:
  - name: ConvertIfStatementToReturnStatement
  - name: InvertIf
  - name: ArrangeObjectCreationWhenTypeEvident
  - name: RedundantCast
  - name: RedundantNameQualifier
  - name: UnusedMember.Global
  - name: UnusedAutoPropertyAccessor.Global
  - name: NotAccessedField.Global
  - name: PossibleNullReferenceException
  - name: ConditionIsAlwaysTrueOrFalse
  - name: CompareOfFloatsByEqualityOperator
  - name: UseObjectOrCollectionInitializer
  - name: CollectionNeverUpdated.Global
  - name: StringCompareToIsCultureSpecific

exclude:
  - name: All
    paths:
      - bin
      - obj
      - packages
      - Migrations
      - wwwroot/lib
      - TestResults
      - Generated
      - .idea
      - .vs
      - src/FatturaFacile.Wpf/app.manifest
      - .editorconfig
  - name: EditorConfigValueCorrectness
    paths:
      - .editorconfig
  - name: EditorConfigShadowingOption

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 800
    low: 150

  testCoverageThresholds:
    fresh: 70
    total: 55
