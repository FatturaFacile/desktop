version: "1.0"

ide: QDNET
linter: qodana-dotnet

profile:
    name: qodana.recommended

# Analisi aggiuntive
include:
    - name: CheckDependencyLicenses
    - name: SqlNoDataSourceInspection
    - name: ArrangeTypeMemberModifiers
    - name: ConvertIfStatementToReturnStatement
    - name: UnusedMember.Global

# Esclusioni tipiche Clean Architecture
exclude:
    - name: All
      paths:
          - bin
          - obj
          - packages
          - Migrations
          - wwwroot/lib
          - TestResults
          - Generated
          - .idea
          - .vs

# Bootstrapper e configurazione DI
bootstrap: |
    dotnet restore
    dotnet build --configuration Release

# Soglie di qualità
failureConditions:
    severityThresholds:
        critical: 0
        high: 0
        moderate: 3
        low: 10

    testCoverageThresholds:
        fresh: 90
        total: 85

    dependencyLicenses:
        failOnProhibited: true
        failOnUnknown: false

# Controllo duplicazione codice
duplication:
    enabled: true

# Configurazione licenze consentite
dependencyLicenses:
    allow:
        - MIT
        - Apache-2.0
        - BSD-2-Clause
        - BSD-3-Clause
        - ISC
        - MPL-2.0

    prohibit:
        - GPL-2.0
        - GPL-3.0
        - AGPL-3.0
