version: "1.0"

linter: jetbrains/qodana-dotnet:latest

profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses
  - name: SqlNoDataSourceInspection
  - name: ConvertIfStatementToReturnStatement

exclude:
  - name: All
    paths:
      - bin
      - obj
      - packages
      - Migrations
      - wwwroot/lib
      - TestResults
      - Generated
      - .idea
      - .vs
      - src/FatturaFacile.Wpf/app.manifest
      - .editorconfig
  - name: EditorConfigValueCorrectness
    paths:
      - .editorconfig
  - name: EditorConfigShadowingOption

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 800
    low: 150

  testCoverageThresholds:
    fresh: 90
    total: 85
